<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>Our World · 全局风格预览</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: #1e2021;
                color: #eee8de;
                font:
                    15px/1.7 system-ui,
                    'Microsoft YaHei',
                    sans-serif;
            }
            main {
                max-width: 1380px;
                margin: auto;
                padding: 32px;
            }
            .eyebrow {
                color: #d7ba8f;
                letter-spacing: 0.12em;
                font-size: 12px;
            }
            h1 {
                font-weight: 500;
                font-size: clamp(25px, 4vw, 40px);
                margin: 8px 0;
            }
            h2 {
                font-size: 21px;
                font-weight: 500;
                margin: 0;
            }
            p {
                color: #c9c4bd;
                margin: 6px 0 14px;
            }
            nav {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin: 20px 0 28px;
                align-items: center;
            }
            button,
            a {
                color: #efd4ab;
            }
            nav button,
            nav a,
            .play {
                min-height: 44px;
                padding: 10px 18px;
                border: 1px solid #5a544c;
                border-radius: 12px;
                font: inherit;
                background: transparent;
                cursor: pointer;
            }
            nav button[aria-pressed='true'] {
                background: #e2c59b;
                color: #2b2722;
                border-color: #e2c59b;
            }
            :focus-visible {
                outline: 3px solid #f9dfb4;
                outline-offset: 4px;
            }
            .catalog {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 22px;
            }
            .domain {
                background: #27292a;
                border: 1px solid #ffffff17;
                border-radius: 18px;
                padding: 20px;
                min-width: 0;
            }
            .domain:first-child {
                grid-column: 1 / -1;
            }
            .catalog[data-view='ui'] .domain {
                grid-column: 1 / -1;
            }
            .domain header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 16px;
                margin-bottom: 14px;
            }
            .gallery {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr));
                gap: 12px;
            }
            figure {
                margin: 0;
                min-width: 0;
            }
            .asset {
                display: grid;
                place-items: center;
                min-height: 180px;
                padding: 10px;
                background: #333332;
                border-radius: 12px;
                overflow: hidden;
            }
            img {
                display: block;
                width: 100%;
                height: 260px;
                object-fit: contain;
            }
            .domain:first-child img {
                height: min(55vw, 520px);
            }
            figcaption {
                font-size: 12px;
                color: #c9c4bd;
                margin: 8px 2px 0;
                line-height: 1.6;
            }
            footer {
                border-top: 1px solid #ffffff20;
                margin-top: 30px;
                padding-top: 18px;
            }
            .empty {
                padding: 30px;
                border: 1px dashed #76634d;
                border-radius: 12px;
            }
            [hidden] {
                display: none !important;
            }
            @media (max-width: 700px) {
                main {
                    padding: 20px 14px;
                }
                .catalog {
                    grid-template-columns: 1fr;
                }
                .domain {
                    padding: 14px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <div class="eyebrow">OUR WORLD / LIVING DESIGN SYSTEM</div>
            <h1>先看风格，再读规范</h1>
            <p>直接展示常驻文档里的真实素材与实景。图片说明保留原文，点击图片看原件，详细状态与交互见对应规范。</p>
            <nav aria-label="风格预览范围">
                <button id="world" data-view="world" aria-pressed="true">整体风格</button>
                <button id="ui" data-view="ui" aria-pressed="false">UI / UX 全局</button>
                <a id="source" href="design-system.md">阅读整体规范 ↗</a>
                <a href="codex-visual/ui-unification/climate-controls.html">植物园兼容 / 暮色信纸看样 ↗</a>
            </nav>
            <p id="status" role="status">正在读取常驻设计资料…</p>
            <div id="catalog" class="catalog"></div>
            <footer>
                <p>
                    采用状态以链接的 Markdown
                    为准；旧实景有拍摄日期，不冒充本轮新实现。动图按需播放，静态素材不代表动画已经实现。
                </p>
                <a href="codex-visual/README.md">进入候选与比稿工作台 ↗</a>
                <p>本页不收录待选方案。预览从常驻 Markdown 自动取材，更新资料和原素材后刷新即可；没有另存一套图片。</p>
            </footer>
        </main>
        <script type="module" src="./preview.js"></script>
    </body>
</html>
