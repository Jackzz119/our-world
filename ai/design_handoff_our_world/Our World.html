<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我们的小世界 · Our World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* ── Cinnamoroll palette ── */
    --sky-1:#AEDFF2;
    --sky-2:#BFE3F5;
    --sky-3:#D8EFFA;
    --cream:#FBFCFE;
    --butter:#FCE7B0;
    --blush:#F8D7DF;
    --navy-1:#2A3A5E;
    --navy-2:#1E2A47;
    --navy-deep:#141d33;

    /* glass tokens (overridden per glass style) */
    --glass-bg:rgba(255,255,255,.66);
    --glass-bg-2:rgba(255,255,255,.42);
    --glass-border:rgba(255,255,255,.75);
    --glass-hi:rgba(255,255,255,.85);
    --glass-blur:22px;
    --glass-sat:150%;
    --glass-shadow:0 18px 44px -12px rgba(30,42,71,.42), 0 4px 14px -6px rgba(30,42,71,.30);
    --glass-text:#2A3A5E;
    --glass-sub:rgba(42,58,94,.62);
    --glass-glow:rgba(174,223,242,.55);
    --accent:#7CC6EC;
    --accent-deep:#4FA9DC;

    --r-lg:24px; --r-md:18px; --r-sm:14px; --r-pill:999px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--navy-2)}
  body{
    font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;
    color:var(--glass-text);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  #root{position:fixed;inset:0;}
  .num{font-family:"Baloo 2","Noto Sans SC",system-ui,sans-serif;font-feature-settings:"tnum";}

  /* ════ GLASS STYLES ════ */
  [data-glass="cloud"]{
    --glass-bg:rgba(255,255,255,.70); --glass-bg-2:rgba(255,255,255,.44);
    --glass-border:rgba(255,255,255,.82); --glass-hi:rgba(255,255,255,.92);
    --glass-text:#2A3A5E; --glass-sub:rgba(42,58,94,.60); --glass-glow:rgba(255,255,255,.6);
    --accent:#8AD0F2; --accent-deep:#54A6D8;
  }
  [data-glass="sky"]{
    --glass-bg:rgba(196,230,248,.56); --glass-bg-2:rgba(214,239,250,.38);
    --glass-border:rgba(255,255,255,.7); --glass-hi:rgba(255,255,255,.8);
    --glass-text:#234063; --glass-sub:rgba(35,64,99,.62); --glass-glow:rgba(174,223,242,.7);
    --accent:#7CC6EC; --accent-deep:#3F98Cf;
  }
  [data-glass="twilight"]{
    --glass-bg:rgba(42,58,94,.52); --glass-bg-2:rgba(30,42,71,.40);
    --glass-border:rgba(190,220,245,.36); --glass-hi:rgba(214,239,250,.45);
    --glass-text:#EEF6FC; --glass-sub:rgba(216,233,247,.72); --glass-glow:rgba(124,198,236,.5);
    --accent:#9FD6F4; --accent-deep:#6FBCE8;
    --glass-shadow:0 20px 48px -12px rgba(10,16,32,.6), 0 4px 14px -6px rgba(10,16,32,.5);
  }

  /* frosted glass surface mixin */
  .glass{
    background:linear-gradient(160deg,var(--glass-bg),var(--glass-bg-2));
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
    backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
    border:1px solid var(--glass-border);
    box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
    color:var(--glass-text);
  }

  /* ════ SCENE / MOOD ════ */
  .scene-base{position:absolute;inset:0;overflow:hidden;}
  .room-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:max(24px,4vh) max(16px,3vw);pointer-events:none;}
  .room-stage svg{width:min(100%,1180px);height:auto;max-height:100%;filter:saturate(1.02);}
  /* ambient base gradient that shows when the slot is empty — mood-aware
     so the world feels atmospheric even before a photo is dropped */
  .scene-ambient{position:absolute;inset:0;pointer-events:none;transition:background .9s ease;
    background:
      radial-gradient(78% 60% at 24% 22%, rgba(255,221,160,.62), transparent 62%),
      radial-gradient(60% 50% at 88% 14%, rgba(255,198,158,.45), transparent 60%),
      radial-gradient(95% 72% at 84% 92%, rgba(170,155,205,.45), transparent 62%),
      linear-gradient(165deg,#e2d6ec 0%, #b6acd2 36%, #7d78ac 68%, #4a4d7a 100%);}
  [data-mood="golden"] .scene-ambient{
    background:
      radial-gradient(120% 80% at 76% 12%, rgba(255,238,184,.92), transparent 55%),
      radial-gradient(95% 75% at 18% 98%, rgba(247,178,148,.6), transparent 60%),
      linear-gradient(160deg,#FFE3AC 0%, #F7B98C 40%, #C98AA0 72%, #6E5A86 100%);}
  [data-mood="twilight"] .scene-ambient{
    background:
      radial-gradient(82% 62% at 24% 22%, rgba(255,216,150,.7), transparent 62%),
      radial-gradient(58% 48% at 86% 12%, rgba(255,190,150,.5), transparent 58%),
      radial-gradient(95% 72% at 86% 92%, rgba(168,150,205,.42), transparent 62%),
      linear-gradient(165deg,#e6d6e8 0%, #c2aecf 32%, #8f82b2 64%, #565279 100%);}
  [data-mood="night"] .scene-ambient{
    background:
      radial-gradient(48% 40% at 30% 42%, rgba(255,212,152,.5), transparent 65%),
      radial-gradient(85% 62% at 80% 94%, rgba(72,104,176,.42), transparent 65%),
      linear-gradient(165deg,#3a4a78 0%, #25325a 45%, #161f3b 78%, #0e1430 100%);}

  /* mood overlays — sit ON TOP of the room image */
  .mood{position:absolute;inset:0;pointer-events:none;transition:opacity .9s ease, background .9s ease;}
  .mood-tint{mix-blend-mode:soft-light;}
  .mood-glow{mix-blend-mode:screen;}
  .mood-vignette{box-shadow:inset 0 0 200px 40px rgba(20,29,51,.0);transition:box-shadow .9s ease;}

  [data-mood="golden"] .mood-tint{
    background:linear-gradient(150deg, rgba(255,221,150,.85) 0%, rgba(255,180,140,.45) 55%, rgba(120,90,150,.35) 100%);opacity:.5;}
  [data-mood="golden"] .mood-glow{
    background:radial-gradient(60% 50% at 78% 20%, rgba(255,228,168,.75), transparent 70%);opacity:.9;}
  [data-mood="golden"] .mood-vignette{box-shadow:inset 0 0 220px 30px rgba(70,40,30,.28);}

  [data-mood="twilight"] .mood-tint{
    background:linear-gradient(160deg, rgba(255,206,150,.62) 0%, rgba(214,168,180,.45) 48%, rgba(90,86,135,.6) 100%);opacity:.52;}
  [data-mood="twilight"] .mood-glow{
    background:radial-gradient(48% 42% at 24% 28%, rgba(255,228,170,.62), transparent 72%),
               radial-gradient(40% 36% at 84% 70%, rgba(255,200,170,.4), transparent 75%);opacity:.9;}
  [data-mood="twilight"] .mood-vignette{box-shadow:inset 0 0 240px 50px rgba(20,29,51,.45);}

  [data-mood="night"] .mood-tint{
    background:linear-gradient(165deg, rgba(40,56,98,.78) 0%, rgba(24,34,64,.86) 55%, rgba(15,20,40,.92) 100%);
    mix-blend-mode:multiply;opacity:.55;}
  [data-mood="night"] .mood-glow{
    background:radial-gradient(34% 30% at 30% 42%, rgba(255,214,150,.7), transparent 70%),
               radial-gradient(28% 24% at 70% 66%, rgba(150,190,255,.4), transparent 74%);opacity:.95;}
  [data-mood="night"] .mood-vignette{box-shadow:inset 0 0 260px 70px rgba(8,12,28,.7);}
  .mood-stars{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .9s ease;
    background-image:
      radial-gradient(1.4px 1.4px at 18% 22%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 64% 14%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 82% 30%, #fff, transparent),
      radial-gradient(1px 1px at 42% 9%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 8% 40%, #fff, transparent),
      radial-gradient(1.1px 1.1px at 90% 50%, #cfe6ff, transparent);
    animation:twinkle 4.5s ease-in-out infinite;}
  [data-mood="night"] .mood-stars{opacity:.9;}
  @keyframes twinkle{0%,100%{opacity:.55}50%{opacity:.95}}

  /* ════ WEATHER ════ */
  .wx-layer{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .9s ease;}
  /* sunny: warm glow + soft god-rays */
  [data-wx="sun"] .wx-sun{opacity:1;
    background:
      radial-gradient(46% 40% at 76% 14%, rgba(255,238,176,.55), transparent 70%),
      radial-gradient(30% 26% at 74% 12%, rgba(255,246,210,.7), transparent 70%);}
  .wx-sun::after{content:"";position:absolute;top:-12%;right:6%;width:46%;height:80%;
    background:linear-gradient(115deg, rgba(255,244,200,.0) 38%, rgba(255,244,200,.22) 46%, rgba(255,244,200,.0) 54%);
    transform:rotate(8deg);}
  /* rain: animated streaks + cool dim */
  [data-wx="rain"] .wx-rain{opacity:1;
    background:
      linear-gradient(180deg, rgba(40,58,94,.18), rgba(40,58,94,.05));}
  .wx-rain::before{content:"";position:absolute;inset:-20% 0;
    background-image:repeating-linear-gradient(102deg,
      rgba(200,224,245,0) 0 6px, rgba(200,224,245,.42) 6px 7px, rgba(200,224,245,0) 7px 13px);
    background-size:auto 120px;animation:rainfall .6s linear infinite;}
  @keyframes rainfall{from{background-position:0 0}to{background-position:24px 120px}}
  /* snow: drifting flakes */
  [data-wx="snow"] .wx-snow{opacity:1;}
  .wx-snow::before,.wx-snow::after{content:"";position:absolute;inset:-20% 0;
    background-image:
      radial-gradient(2.2px 2.2px at 20% 10%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 50% 20%, #fff, transparent),
      radial-gradient(2px 2px at 78% 8%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 35% 40%, #fff, transparent),
      radial-gradient(2px 2px at 65% 50%, #eaf4ff, transparent);
    background-size:auto 280px;animation:snowfall 7s linear infinite;opacity:.9;}
  .wx-snow::after{background-size:auto 200px;animation-duration:11s;opacity:.6;}
  @keyframes snowfall{from{background-position:0 -280px}to{background-position:30px 280px}}
  @media (prefers-reduced-motion: reduce){
    .wx-rain::before,.wx-snow::before,.wx-snow::after{animation:none}
  }

  /* top + bottom legibility scrims */
  .scrim-top{position:absolute;top:0;left:0;right:0;height:230px;pointer-events:none;
    background:linear-gradient(to bottom, rgba(20,29,51,.34), transparent);transition:opacity .9s;}
  [data-mood="golden"] .scrim-top{background:linear-gradient(to bottom, rgba(90,55,30,.26), transparent);}
  .scrim-bot{position:absolute;bottom:0;left:0;right:0;height:240px;pointer-events:none;
    background:linear-gradient(to top, rgba(20,29,51,.30), transparent);}

  /* float keyframes for weightless HUD */
  @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes floatC{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @media (prefers-reduced-motion: reduce){
    .mood-stars{animation:none}
    [style*="floatA"],[style*="floatB"],[style*="floatC"]{animation:none !important}
  }

  /* heartbeat */
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.12)}}
</style>
</head>
